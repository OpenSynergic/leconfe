name: tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Leconfe
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, pdo_sqlite, zip

      - name: Install Leconfe dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Build plugin checkout manifest
        run: |
          yq -r '.plugins[] | [.name, .repository, .ref] | @tsv' data/plugin-test-sources.yaml > "${RUNNER_TEMP}/plugin-test-sources.tsv"

      - name: Checkout plugin sources
        env:
          PLUGIN_READ_TOKEN: ${{ secrets.LECONFE_PLUGINS_READ_TOKEN }}
        run: |
          while IFS=$'\t' read -r plugin repository ref; do
            if ! [[ "${plugin}" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "Invalid plugin name: ${plugin}" >&2
              exit 1
            fi

            if ! [[ "${repository}" =~ ^leconfe/[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid plugin repository: ${repository}" >&2
              exit 1
            fi

            if ! [[ "${ref}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "Invalid plugin ref: ${ref}" >&2
              exit 1
            fi

            if [[ -n "${PLUGIN_READ_TOKEN}" ]]; then
              git -c http.extraheader="AUTHORIZATION: bearer ${PLUGIN_READ_TOKEN}" \
                clone --depth 1 --branch "${ref}" "https://github.com/${repository}.git" "plugins/${plugin}"
            else
              git clone --depth 1 --branch "${ref}" "https://github.com/${repository}.git" "plugins/${plugin}"
            fi
          done < "${RUNNER_TEMP}/plugin-test-sources.tsv"

      - name: Install plugin dependencies
        run: |
          while IFS= read -r -d '' composer_file; do
            (
              cd "$(dirname "${composer_file}")"
              composer install --no-ansi --no-interaction --no-progress --prefer-dist
            )
          done < <(find plugins -mindepth 2 -maxdepth 2 -name composer.json -print0)

      - name: Run application and plugin tests
        run: composer test
